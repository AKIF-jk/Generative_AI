services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_ROOT=/models
    volumes:
      # Keep the repository's result layout aligned with MODEL_ROOT/taskN.
      - ./results/task1:/models/task1:ro
      - ./results/task2/onnx/onnx:/models/task2:ro
      - ./results/task4/models:/models/task4:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
